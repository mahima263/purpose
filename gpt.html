<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Stats Section</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fb;
      margin: 0;
      padding: 40px;
      color: #222;
    }

    h2 {
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 60px;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      flex: 1;
      min-width: 220px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      opacity: 0.8;
    }

    .card span {
      font-size: 26px;
      font-weight: bold;
      color: #1e4ed8;
    }

    .chart-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 340px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Our Universe Section -->
  <div class="section">
    <h2>Our Universe</h2>
    <div class="cards">
      <div class="card">
        <h3>Total Students (All Programs)</h3>
        <span>9,500+</span>
      </div>
      <div class="card">
        <h3>Undergraduate Students</h3>
        <span>5,084</span>
      </div>
      <div class="card">
        <h3>Postgraduate & PhD Students</h3>
        <span>~4,400</span>
      </div>
    </div>
  </div>

  <!-- Student Demographics Section -->
  <div class="section">
    <h2>Student Demographics</h2>
    <p>Total UG Students: <strong>5,084</strong></p>

    <div class="chart-container">
      <h3>UG Gender Distribution</h3>
      <canvas id="genderChart"></canvas>
    </div>
  </div>

<script>
  const women = 1031;
  const men = 4053;

  new Chart(document.getElementById("genderChart"), {
    type: 'pie',
    data: {
      labels: ["Women (20.28%)", "Men (79.72%)"],
      datasets: [{
        data: [women, men],
        backgroundColor: ["#ec4899", "#3b82f6"]
      }]
    },
    options: {
      responsive: true
    }
  });
</script>

</body>
</html>
