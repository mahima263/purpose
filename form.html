<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner with IIT Kanpur – new split design</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Bootstrap 5 for grid (lightweight) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS for subtle animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== SPLIT CONTACT SECTION ===== */
        .contact-split {
            position: relative;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        /* background image with dark overlay */
        .contact-split::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('_IIT6245.JPG') center/cover no-repeat;
            filter: brightness(0.4);  /* darkens image for better text contrast */
            z-index: -2;
        }

        .contact-split::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 100%);
            z-index: -1;
        }

        .split-container {
            width: 100%;
            padding: 4rem 2rem;
        }

        /* left column content */
        .left-content {
            padding-right: 3rem;
        }

        .icon-large {
            font-size: 4rem;
            color: #c49a6c;  /* accent */
            margin-bottom: 1.5rem;
        }

        .left-content h2 {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .left-content .lead {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin-top: 2rem;
        }

        .feature-list li {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .feature-list i {
            color: #c49a6c;
            margin-right: 0.8rem;
            width: 1.5rem;
        }

        /* right column form card */
        .form-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 2rem 1.8rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            color: #1e1e1e;
        }

        .form-card h3 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1e1e1e;
        }

        .form-card .sub {
            color: #5f5f5f;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 1rem;
        }

        .form-wrapper iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 16px;
            background: #fafafa; /* subtle background while loading */
        }

        /* mobile adjustments */
        @media (max-width: 991px) {
            .split-container {
                padding: 3rem 1.5rem;
            }
            .left-content {
                padding-right: 0;
                margin-bottom: 3rem;
                text-align: center;
            }
            .feature-list {
                text-align: left;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }
            .left-content h2 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 576px) {
            .form-wrapper iframe {
                height: 550px;
            }
        }

        /* optional small note */
        .privacy-note {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<!-- ========== SPLIT CONTACT SECTION ========== -->
<section class="contact-split">
    <div class="container-fluid split-container">
        <div class="row align-items-center g-5">
            <!-- LEFT COLUMN: MESSAGE -->
            <div class="col-lg-6" data-aos="fade-right" data-aos-duration="1000">
                <div class="left-content">
                    <div class="icon-large">
                        <i class="fas fa-handshake"></i>
                    </div>
                    <h2>Partner with<br>IIT Kanpur</h2>
                    <p class="lead">Ensure that financial constraints never stand in the way of merit.</p>
                    
                    <!-- optional bullet points to strengthen message (can be removed) -->
                    <ul class="feature-list">
                        <li><i class="fas fa-check-circle"></i> Support deserving students</li>
                        <li><i class="fas fa-check-circle"></i> Fund cutting-edge research</li>
                        <li><i class="fas fa-check-circle"></i> Build India's technological future</li>
                    </ul>
                </div>
            </div>

            <!-- RIGHT COLUMN: ZOHO FORM -->
            <div class="col-lg-6" data-aos="fade-left" data-aos-duration="1000">
                <div class="form-card">
                    <h3>Talk to our team</h3>
                    <div class="sub">Fill the form and we’ll connect with you</div>
                    <div class="form-wrapper">
                        <iframe 
                            aria-label="Partner with IIT Kanpur | Talk to us" 
                            frameborder="0" 
                            src="https://forms.zohopublic.in/iitkanpurdf1/form/PartnerwithIITKanpurTalktous/formperma/fSF4-5aWdZNO70p44j_V-RY-PVVsuhgENdZ3FQ208Bc">
                        </iframe>
                    </div>
                    <p class="privacy-note text-end mt-2">✔ Your information is secure</p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Bootstrap JS (optional for grid only, not required) -->
<!-- AOS init -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
</script>

<!-- 
    WHAT CHANGED?
    - Complete layout overhaul: now two columns (text left / form right)
    - Background image dimmed with overlay for better readability
    - Left side uses large white text with accent icons
    - Form placed in a clean white card with subtle shadow
    - Removed old contact card and all unnecessary elements
    - Responsive: stacks on mobile with centered text
    - Kept the exact Zoho iframe as requested
    - No address, email, phone – only the form
-->

</body>
</html>
