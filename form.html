<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner with IIT Kanpur</title>
    <!-- Font Awesome (optional, for icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- AOS library for animation (optional) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --primary-color: #c49a6c;
            --primary-dark: #9e7a54;
            --accent-gold: #e5b87b;
            --text-dark: #2c2c2c;
            --transition: all 0.3s ease;
        }

        /* ===== CONTACT SECTION ===== */
        .contact-section {
            padding: 100px 0;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .contact-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('_IIT6245.JPG');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .contact-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(23, 18, 17, 0.087) 0%, rgba(45, 19, 13, 0) 100%);
            z-index: -1;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            transition: var(--transition);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            color: var(--text-dark);
        }

        .contact-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .contact-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        /* ===== FOOTER – COMPACT STYLE ===== */
        .footer {
            background: var(--primary-dark);
            color: rgba(255, 255, 255, 0.9);
            padding: 1.5rem 0;           /* reduced from 3rem to 1.5rem */
            text-align: center;
            font-size: 0.95rem;
        }

        .footer a {
            color: var(--accent-gold);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer p {
            margin: 0.25rem 0;           /* minimal vertical spacing */
            line-height: 1.4;
        }

        /* optional small screens adjustment */
        @media (max-width: 576px) {
            .contact-card {
                padding: 30px 20px;
            }
            .footer {
                padding: 1rem 0;
            }
        }
    </style>
</head>
<body>

<!-- ========== CONTACT SECTION (ONLY FORM) ========== -->
<section id="contact" class="contact-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="contact-card text-center" data-aos="zoom-in" data-aos-duration="800">
                    <!-- Zoho Form – height increased to avoid scrollbar -->
                    <iframe 
                        aria-label="Partner with IIT Kanpur | Talk to us" 
                        frameborder="0" 
                        style="height:700px; width:100%; border:none; border-radius: 12px; margin-top: 10px;" 
                        src="https://forms.zohopublic.in/iitkanpurdf1/form/PartnerwithIITKanpurTalktous/formperma/fSF4-5aWdZNO70p44j_V-RY-PVVsuhgENdZ3FQ208Bc">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- ========== COMPACT FOOTER ========== -->
<footer class="footer">
    <div class="container">
        <!-- Address in two compact lines -->
        <p>Office of Dean of Resources & Alumni, Faculty Building Annexe Third floor,<br>
           IIT Kanpur – 208016, Uttar Pradesh, India</p>
        <p>Mr. Rajat Sharma | Email: <a href="mailto:rajatsharma@iitkdf.org">rajatsharma@iitkdf.org</a></p>
        <p style="margin-top: 0.75rem; opacity: 0.8;">&copy; 2026 IIT Kanpur. All rights reserved.</p>
    </div>
</footer>

<!-- AOS initialization -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
</script>

</body>
</html>
